; Persistent feature-flag configuration for Rolnopol.
;
; Copy this file to `feature-flags.ini` in the project root, set the flags you
; care about, and they survive restarts, "Reset to defaults" on the Feature Flags
; page, and even a full database restore — because this file is not a database.
;
;     cp feature-flags.example.ini feature-flags.ini
;
; Precedence:  code defaults  ->  data/feature-flags.json  ->  feature-flags.ini
;
; What happens on startup (mode = enforce, the default):
;   1. the values below are seeded into data/feature-flags.json
;   2. they are re-applied on every read, so the app cannot drift away from them
;   3. the Feature Flags page marks them "Pinned" and disables their toggles
;   4. a PATCH/PUT that tries to change one is rejected with HTTP 409
;   5. the whole override set is logged as WARN on the console and on /backend.html
;
; Under NODE_ENV=test this file is ignored completely so the test suite keeps
; full control of the flags.

[settings]
; enforce — seed at boot AND override on every read; pinned flags are read-only (default)
; seed    — seed at boot only; the app owns the value afterwards
; off     — parse the file for reporting but never apply it
mode = enforce

; Accepted values everywhere below: true/false, 1/0, on/off, yes/no (case-insensitive)
[flags]
; --- modules ---
; crewOfficeEnabled = true
; agriAcademyEnabled = true
; farmStayEnabled = false
; greenhouseControlRoomEnabled = false
; taskLabEnabled = false

; --- communication ---
; messengerEnabled = false
; assistantChatEnabled = false
; notificationCenterEnabled = false

; --- monitoring ---
; prometheusMetricsEnabled = false

; --- pages & UI ---
; rolnopolMapEnabled = true
; weatherPageEnabled = false
; cookieConsentBannerEnabled = false
; homeModernRestyleEnabled = false

; --- security ---
; twoFactorAuthEnabled = false
; registrationStrongPasswordEnabled = false
