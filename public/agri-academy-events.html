<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgriAcademy — Exam Activity</title>
    <link rel="icon" type="image/png" href="/images/logo/favicon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/pages/agri-academy.css" />
    <style>
      :root {
        --bg: #0f1a14;
        --card: #16241b;
        --ink: #eaf3ec;
        --muted: #9bb3a4;
        --accent: #3fae6b;
        --accent-2: #7bd4a0;
        --border: #24382b;
        --up: #3fbf6b;
        --down: #ff8a8a;
        --warn: #ffce6b;
        --info: #7fb8ff;
      }
      * {
        box-sizing: border-box;
      }
      .footer {
        border-top: 1px solid var(--border);
      }
      body {
        margin: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: radial-gradient(1200px 600px at 80% -10%, #1c3326 0%, var(--bg) 55%);
        color: var(--ink);
        min-height: 100vh;
      }
      .topbar {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px 24px 0;
      }
      .topbar a {
        color: var(--accent-2);
        text-decoration: none;
        font-size: 14px;
      }
      header {
        padding: 24px 24px 8px;
        max-width: 1080px;
        margin: 0 auto;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--accent-2);
        font-size: 12px;
        font-weight: 700;
      }
      h1 {
        margin: 6px 0 4px;
        font-size: 32px;
      }
      .sub {
        color: var(--muted);
        margin: 0;
        max-width: 70ch;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 16px 24px 64px;
      }
      /* Filters */
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin: 18px 0 12px;
      }
      .toolbar label {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      select,
      .refresh {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        font: inherit;
        font-size: 14px;
      }
      .refresh {
        cursor: pointer;
      }
      .refresh:hover {
        border-color: var(--accent);
      }
      .refresh:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .spacer {
        flex: 1;
      }
      .count {
        color: var(--muted);
        font-size: 13px;
      }
      /* Live-tail pill: click to stop/resume the SSE stream */
      .live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--card);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 13px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .live:hover {
        border-color: var(--accent);
      }
      .live .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .live--on {
        color: var(--accent-2);
      }
      .live--on .dot {
        background: var(--up);
        animation: pulse 1.8s ease-in-out infinite;
      }
      .live--wait {
        color: var(--warn);
      }
      .live--wait .dot {
        background: var(--warn);
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      /* A row that arrived over the stream, so the eye can find it */
      tbody tr.is-new {
        animation: landed 2.4s ease-out;
      }
      @keyframes landed {
        0% {
          background: rgba(63, 191, 107, 0.28);
        }
        100% {
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .live--on .dot,
        tbody tr.is-new {
          animation: none;
        }
      }
      /* The "N new entries" pill, shown only while the view is detached from the
         top and the tail has landed something the visitor cannot see. */
      .jump {
        position: absolute;
        top: 52px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #1d3a29;
        color: var(--accent-2);
        border: 1px solid #2f6144;
        border-radius: 999px;
        padding: 8px 16px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
      }
      .jump:hover {
        border-color: var(--accent-2);
      }
      .jump[hidden] {
        display: none;
      }
      /* Log table */
      .log {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        overflow: hidden;
      }
      /* The scroll viewport: the tail lands at the top, history pages in at the
         bottom, and both live in this one box. */
      .scroll {
        overflow: auto;
        max-height: min(62vh, 640px);
        overscroll-behavior: contain;
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
      }
      /* Scroll-back sentinel: the row the observer watches, and the only place the
         history loader ever reports itself. */
      .older {
        padding: 14px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        border-top: 1px solid var(--border);
        /* Matches the table, so the sentinel still spans the row width when the
           viewport is scrolled sideways on a narrow screen. */
        min-width: 720px;
      }
      .older[data-state="more"],
      .older[data-state="error"] {
        cursor: pointer;
        user-select: none;
      }
      .older[data-state="more"] {
        color: var(--accent-2);
        font-weight: 600;
      }
      .older[data-state="more"]:hover,
      .older[data-state="error"]:hover {
        background: #1a2b20;
      }
      .older:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .older[data-state="error"] {
        color: var(--down);
      }
      .older[data-state="end"] {
        color: #6f8a7a;
        font-style: italic;
      }
      .older[hidden] {
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        min-width: 720px;
      }
      th,
      td {
        text-align: left;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        background: #121d16;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #1a2b20;
      }
      td.wrap {
        white-space: normal;
        max-width: 260px;
      }
      .seq {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .mono {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        color: var(--muted);
      }
      a.unit-link {
        color: var(--accent-2);
        text-decoration: none;
      }
      a.unit-link:hover {
        text-decoration: underline;
      }
      /* One badge per session state, coloured by what it means for the taker */
      .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge--pay {
        color: var(--warn);
        border-color: #4b3d1c;
      }
      .badge--entitled {
        color: var(--info);
        border-color: #234058;
      }
      .badge--active {
        color: var(--accent-2);
        border-color: #23533a;
      }
      .badge--submitted {
        color: var(--warn);
        border-color: #4b3d1c;
      }
      .badge--scored {
        color: var(--up);
        border-color: #23533a;
      }
      .badge--dead {
        color: var(--down);
        border-color: #52292d;
      }
      .win {
        font-size: 12px;
        color: var(--muted);
      }
      .state {
        padding: 26px 18px;
        text-align: center;
        color: var(--muted);
      }
      .footnote {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .footnote a {
        color: var(--accent-2);
        text-decoration: none;
      }
      .footnote a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body class="agri-academy-page">
    <div id="header-component"></div>
    <div class="topbar"><a href="/agri-academy-units.html">← Certification units</a></div>
    <header>
      <div class="eyebrow">📜 AgriAcademy</div>
      <h1>Exam Activity</h1>
    </header>
    <main>
      <div class="toolbar">
        <label>
          Unit
          <select id="unitFilter" aria-label="Filter by certification unit">
            <option value="">All units</option>
          </select>
        </label>
        <label>
          State
          <select id="stateFilter" aria-label="Filter by session state">
            <option value="">All states</option>
            <option value="awaiting_payment">Awaiting payment</option>
            <option value="entitled">Entitled</option>
            <option value="active">Active</option>
            <option value="submitted">Submitted</option>
            <option value="scored">Scored</option>
            <option value="expired_scored">Expired (scored)</option>
            <option value="expired_unstarted">Expired (unstarted)</option>
            <option value="abandoned">Abandoned</option>
          </select>
        </label>
        <label title="How many entries one page reads — scroll or use the control under the last row for the next page">
          Per page
          <select id="limitFilter" aria-label="Entries per page" data-testid="activity-page-size">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="250">250</option>
          </select>
        </label>
        <div class="spacer"></div>
        <span class="count" id="count">—</span>
        <button id="liveBtn" class="live" aria-pressed="true" title="Stream new entries as they happen">
          <i class="dot"></i> <span id="liveLabel">Connecting…</span>
        </button>
        <button id="refreshBtn" class="refresh"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
      </div>

      <div class="log">
        <button id="jumpLive" class="jump" type="button" hidden data-testid="activity-jump-live">
          <i class="fa-solid fa-arrow-up"></i> <span id="jumpLiveLabel">New entries</span>
        </button>
        <div class="scroll" id="logScroll" data-testid="activity-scroll">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>When</th>
                <th>Unit</th>
                <th>Exam</th>
                <th>Session</th>
                <th>State</th>
                <th>Clock</th>
              </tr>
            </thead>
            <tbody id="rows" data-testid="activity-rows"></tbody>
          </table>
          <div id="older" class="older" data-testid="activity-older" data-state="idle" hidden></div>
        </div>
        <div id="logState" class="state">Loading activity…</div>
      </div>
    </main>

    <div id="footer-component"></div>

    <script src="/js/core/event-bus.js"></script>
    <script src="/js/core/storage.js"></script>
    <script src="/js/core/app.js"></script>
    <script src="/js/services/api-service.js"></script>
    <script src="/js/services/auth-service.js"></script>
    <script src="/js/services/feature-flags-service.js"></script>
    <script src="/js/components/notification.js"></script>
    <script src="/js/components/navigation.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils/error-logger.js"></script>
    <script src="/js/utils/utils.js"></script>
    <script src="/js/utils/global-compat.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/utils/init-navigation.js"></script>
    <script>
      initNavigation("agri-academy");
    </script>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const esc = (s) =>
          String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

        // Deep link support: /agri-academy-events.html?unit=unit-3 lands pre-filtered,
        // which is what the per-unit panels link to.
        const params = new URLSearchParams(location.search);
        let unitFilter = params.get("unit") || "";

        // ── Two cursors, pointing opposite ways ───────────────────────────────────
        //
        // This view is a live tail AND a history reader over the same log, so it holds
        // one cursor of each kind at once and must never confuse them:
        //
        //   cursor   the highest sequence seen. Handed to the SSE tail as `?since=`,
        //            and the guard that makes a replayed entry a no-op.
        //   oldest   the lowest sequence rendered. Handed to REST as `?before=` to
        //            read the page below the window — scroll-back.
        //
        // `total` comes from the service and does NOT move with `?before=`, which is
        // what lets "Showing 150 of 812" stay true while paging into history.
        let stream = null; // the open EventSource, when the tail is running
        let cursor = 0;
        let oldest = 0;
        let hasMore = false; // the service says history exists below the oldest row
        let loadingOlder = false;
        let olderFailed = false; // a failed page stops the auto-chain until asked again
        let total = 0; // entries the service counts for this filter, kept in step live
        let scanned = 0; // entries pulled from the service, before this page's state filter
        let rendered = 0; // rows actually in the table
        let pending = []; // live entries held back while the view is detached from the top
        let following = true; // the view sits at the top, so the tail may write into it
        let liveOn = true;

        // A window that never trims grows without bound while the tail runs; a window
        // that trims while somebody is reading history throws away what they scrolled
        // for. So trim only from the BOTTOM, only while following, and hand the history
        // cursor back to the row that is now last — the window stays self-consistent.
        const MAX_ROWS = 1000;
        const FOLLOW_EPS = 12; // px from the top that still counts as "at the top"
        const CHAIN_MAX = 10; // history pages one scroll may pull (a state filter empties many)
        const NEAR_BOTTOM = 200; // px of runway before the sentinel counts as reached

        const STATE_META = {
          awaiting_payment: { label: "Awaiting payment", cls: "badge--pay" },
          entitled: { label: "Entitled", cls: "badge--entitled" },
          active: { label: "Active", cls: "badge--active" },
          submitted: { label: "Submitted", cls: "badge--submitted" },
          scored: { label: "Scored", cls: "badge--scored" },
          expired_scored: { label: "Expired (scored)", cls: "badge--scored" },
          expired_unstarted: { label: "Expired (unstarted)", cls: "badge--dead" },
          abandoned: { label: "Abandoned", cls: "badge--dead" },
        };
        const WINDOW_LABEL = { access: "Access window", completion: "Completion window", none: "Stopped" };

        const when = (ms) => (Number(ms) > 0 ? new Date(Number(ms)).toLocaleString() : "—");
        const deadline = (ms) => (Number(ms) > 0 ? new Date(Number(ms)).toLocaleString() : null);

        function badge(state) {
          const meta = STATE_META[state] || { label: state || "unknown", cls: "" };
          return `<span class="badge ${meta.cls}">${esc(meta.label)}</span>`;
        }

        function clockCell(ev) {
          const label = WINDOW_LABEL[ev.window] || ev.window || "—";
          const at = deadline(ev.deadlineAt);
          return `<div class="win">${esc(label)}</div>${at ? `<div class="mono">→ ${esc(at)}</div>` : ""}`;
        }

        function rowHtml(ev, isNew) {
          const unitCell = ev.unitId
            ? `<a class="unit-link" href="/agri-academy-unit.html?unit=${encodeURIComponent(ev.unitId)}">${esc(ev.unitName || ev.unitId)}</a>`
            : `<span class="mono">—</span>`;
          // `data-seq` is not decoration: it is the history cursor, readable from the
          // DOM, so an observer outside this page can tell which window it is looking
          // at without replaying the fetches that produced it.
          return `
                <tr${isNew ? ' class="is-new"' : ""} data-seq="${Number(ev.sequence) || 0}" data-state="${esc(ev.state || "")}" data-testid="activity-row">
                  <td class="seq">${Number(ev.sequence) || 0}</td>
                  <td>${esc(when(ev.at))}</td>
                  <td class="wrap">${unitCell}</td>
                  <td class="wrap">${esc(ev.examTitle || ev.examId || "—")}</td>
                  <td class="mono">${esc(ev.sessionId || "—")}</td>
                  <td>${badge(ev.state)}</td>
                  <td>${clockCell(ev)}</td>
                </tr>`;
        }

        // The count separates the two numbers a reader actually needs. Without a state
        // filter they are the same question; with one, "how many did I match" and "how
        // far into the log did I have to read to match them" come apart, and pretending
        // otherwise is how a paged view starts lying about its own totals.
        function setCount() {
          if ($("stateFilter").value) {
            $("count").textContent = `Showing ${rendered} matching · read ${scanned} of ${total}`;
            return;
          }
          $("count").textContent = `Showing ${rendered} of ${total} ${total === 1 ? "entry" : "entries"}`;
        }

        function setEmpty(text) {
          const el = $("logState");
          el.style.display = text ? "block" : "none";
          if (text) el.textContent = text;
        }

        /** The scroll-back sentinel doubles as its own status line and its own button. */
        function setOlder(state, text) {
          const el = $("older");
          const actionable = state === "more" || state === "error";
          el.dataset.state = state;
          el.textContent = text || "";
          el.hidden = !text;
          el.setAttribute("role", actionable ? "button" : "status");
          el.tabIndex = actionable ? 0 : -1;
        }

        function restOfLog() {
          if (olderFailed) return setOlder("error", "Could not load older entries — retry");
          // "More" is a real control, not a caption. Scrolling to it loads the next
          // page when the window can scroll at all; when a page is shorter than the
          // viewport there is nothing to scroll, and the click is the only way — so
          // it has to be clickable, and say so.
          if (hasMore) return setOlder("more", "↓ Load older entries");
          setOlder("end", rendered ? "Beginning of the log" : "");
        }

        // ── Following ─────────────────────────────────────────────────────────────
        //
        // The tail may only write into the table while the view is at the top. Anywhere
        // else, an arriving entry would push every row the visitor is reading downwards
        // mid-read — so entries are held, counted on a button, and released when they
        // scroll back (or ask for them). This is the whole reason a live list and a
        // scrolled list can share one container.
        const isAtTop = () => $("logScroll").scrollTop <= FOLLOW_EPS;

        function setJump() {
          const btn = $("jumpLive");
          btn.hidden = pending.length === 0;
          if (pending.length) $("jumpLiveLabel").textContent = `${pending.length} new ${pending.length === 1 ? "entry" : "entries"}`;
        }

        function trim() {
          const tbody = $("rows");
          if (tbody.rows.length <= MAX_ROWS) return;
          while (tbody.rows.length > MAX_ROWS) tbody.deleteRow(-1);
          rendered = tbody.rows.length;
          // What was just dropped off the bottom is history again, so the scroll-back
          // cursor moves back up with it and `hasMore` becomes true by construction.
          oldest = Number(tbody.rows[tbody.rows.length - 1]?.dataset.seq) || oldest;
          hasMore = true;
          restOfLog();
        }

        function flushPending() {
          if (!pending.length) return;
          // Buffered newest-last; the table is newest-first.
          const html = pending
            .slice()
            .reverse()
            .map((ev) => rowHtml(ev, true))
            .join("");
          pending = [];
          $("rows").insertAdjacentHTML("afterbegin", html);
          rendered = $("rows").rows.length;
          setEmpty("");
          trim();
          setJump();
          setCount();
        }

        // ── The live tail ─────────────────────────────────────────────────────────
        //
        // The page loads one bounded page over REST, then subscribes from that page's
        // `latestSequence`, so an entry appears when it happens rather than when the
        // visitor thinks to click Refresh. EventSource reconnects on its own and
        // replays its last id, so a dropped connection resumes without gaps — the
        // sequence guard below only has to catch a duplicate.
        function setLive(mode, label) {
          $("liveBtn").className = `live live--${mode}`;
          $("liveLabel").textContent = label;
          $("liveBtn").setAttribute("aria-pressed", String(liveOn));
        }

        function onEntry(ev) {
          if (!ev || Number(ev.sequence) <= cursor) return; // already seen
          cursor = Number(ev.sequence);
          // `total` and `scanned` count the log, not the view: an entry the state
          // filter hides still happened, and still cost a read. Only `rendered` counts
          // rows. Conflating the three is what makes a filtered infinite list unable
          // to say anything true about itself.
          total += 1;
          scanned += 1;
          const stateWanted = $("stateFilter").value;
          if (stateWanted && ev.state !== stateWanted) return setCount();
          if (!following) {
            pending.push(ev);
            setJump();
            return setCount();
          }
          $("rows").insertAdjacentHTML("afterbegin", rowHtml(ev, true));
          rendered += 1;
          setEmpty("");
          trim();
          setCount();
        }

        function stopLive() {
          if (stream) stream.close();
          stream = null;
        }

        function startLive() {
          stopLive();
          if (!liveOn) return setLive("off", "Live off");
          setLive("wait", "Connecting…");
          const query = new URLSearchParams({ since: String(cursor) });
          if (unitFilter) query.set("unitId", unitFilter);
          let framed = false;
          let failures = 0;
          stream = new EventSource("/api/v1/agri-academy/events/stream?" + query.toString(), { withCredentials: true });
          const alive = () => {
            framed = true;
            failures = 0;
            setLive("on", "Live");
          };
          // `ping` is the idle heartbeat: it proves the tail is alive when the log is
          // quiet, which is most of the time.
          stream.addEventListener("ping", alive);
          stream.addEventListener("entry", (e) => {
            alive();
            try {
              onEntry(JSON.parse(e.data));
            } catch {
              /* a frame we cannot read is not worth breaking the tail over */
            }
          });
          // The bridge's own `error` frame: upstream broke, the connection did not.
          stream.addEventListener("error", () => setLive("wait", "Reconnecting…"));
          stream.onerror = () => {
            failures += 1;
            // A non-2xx (flag off, an app that predates this route) fails the connection
            // for good: readyState is CLOSED and no retry is coming. Saying
            // "Reconnecting…" there is a lie, and holding the stream repeats one console
            // error on a timer — so drop it and say so. The table keeps what it read,
            // Refresh still works, and the pill re-opens the tail on click.
            if (stream.readyState === EventSource.CLOSED || (!framed && failures >= 3)) {
              stopLive();
              return setLive("off", "Live unavailable");
            }
            setLive("wait", "Reconnecting…");
          };
        }

        // The unit dropdown is built from the public directory, so it only ever offers
        // units a visitor can actually open.
        async function loadUnits() {
          try {
            const res = await fetch("/api/v1/agri-academy/units", { credentials: "include" });
            if (!res.ok) return;
            const body = await res.json().catch(() => null);
            const units = (body && body.units) || [];
            const sel = $("unitFilter");
            for (const u of units.sort((a, b) => String(a.name).localeCompare(String(b.name)))) {
              const opt = document.createElement("option");
              opt.value = u.unitId;
              opt.textContent = u.name || u.unitId;
              sel.appendChild(opt);
            }
            sel.value = unitFilter;
          } catch {
            /* the log still loads without the dropdown */
          }
        }

        // ── Scroll-back ───────────────────────────────────────────────────────────
        //
        // History is read with the SAME unary route the first page came from, just
        // bounded by `?before=`. Rows land at the BOTTOM, below the viewport, so this
        // direction can never move what is being read — which is precisely why the
        // tail goes up and history goes down.
        /** Reads one page below `oldest`. Returns how many ROWS it put on screen. */
        async function loadOlder() {
          if (loadingOlder || olderFailed || !hasMore || !oldest) return 0;
          loadingOlder = true;
          let added = 0;
          setOlder("loading", "Loading older entries…");
          const stateWanted = $("stateFilter").value;
          const query = new URLSearchParams({ limit: $("limitFilter").value, before: String(oldest) });
          if (unitFilter) query.set("unitId", unitFilter);
          try {
            const res = await fetch("/api/v1/agri-academy/events?" + query.toString(), { credentials: "include" });
            const body = await res.json().catch(() => null);
            if (!res.ok || !body || !Array.isArray(body.events)) {
              olderFailed = true;
              return setOlder(
                "error",
                res.status === 503 ? "The exam-events service is unavailable — retry" : "Could not load older entries — retry",
              );
            }
            const page = body.events;
            scanned += page.length;
            // The cursor follows the PAGE, not the rendered rows: a page the state
            // filter empties still has to advance it, or the next request asks for the
            // same window forever.
            if (page.length) oldest = Number(page[page.length - 1].sequence) || oldest;
            hasMore = !!body.hasMore;
            total = Number(body.total) || total;
            const shown = stateWanted ? page.filter((e) => e.state === stateWanted) : page;
            added = shown.length;
            if (added) {
              $("rows").insertAdjacentHTML("beforeend", shown.map((ev) => rowHtml(ev, false)).join(""));
              rendered = $("rows").rows.length;
              setEmpty("");
            }
            restOfLog();
            if (!rendered && !hasMore) setEmpty(stateWanted ? "No entries match this filter." : "No exam activity recorded yet.");
            setCount();
          } catch {
            olderFailed = true;
            setOlder("error", "Could not reach the AgriAcademy service — retry");
          } finally {
            loadingOlder = false;
          }
          return added;
        }

        const canScroll = () => $("logScroll").scrollHeight > $("logScroll").clientHeight + 4;

        function sentinelReached() {
          const el = $("older");
          if (el.hidden) return false;
          return el.getBoundingClientRect().top <= $("logScroll").getBoundingClientRect().bottom + NEAR_BOTTOM;
        }

        // One page per request — "show 10" must mean 10, not "10 and then however
        // many more happen to fit". The ONE case that chains is a page the state
        // filter emptied: it rendered nothing, so it answered nothing, and an
        // `IntersectionObserver` will not re-fire for a sentinel that never stopped
        // intersecting. Capped, so a filter matching nothing cannot walk the whole log.
        async function loadMore() {
          let guard = 0;
          while (hasMore && !olderFailed && !loadingOlder && guard < CHAIN_MAX) {
            guard += 1;
            if ((await loadOlder()) !== 0) break;
          }
        }

        // The scroll path. Deliberately does nothing when the window cannot scroll:
        // with a page shorter than the viewport the sentinel is on screen from the
        // start, and auto-loading there is what silently turned "10" into "14".
        function autoLoadMore() {
          if (!canScroll() || !sentinelReached()) return;
          loadMore();
        }

        // A reload re-reads the first page AND re-opens the tail: the unit filter is
        // applied by the service, so the subscription itself has to change with it, and
        // the fresh page's high-water mark becomes the new live cursor while its oldest
        // row becomes the new history cursor.
        async function load() {
          const btn = $("refreshBtn");
          btn.disabled = true;
          stopLive();
          pending = [];
          following = true;
          olderFailed = false;
          cursor = oldest = total = scanned = rendered = 0;
          hasMore = false;
          setJump();
          setOlder("idle", "");
          const stateWanted = $("stateFilter").value;
          const query = new URLSearchParams({ limit: $("limitFilter").value });
          if (unitFilter) query.set("unitId", unitFilter);
          try {
            const res = await fetch("/api/v1/agri-academy/events?" + query.toString(), { credentials: "include" });
            const body = await res.json().catch(() => null);
            if (!res.ok || !body || !Array.isArray(body.events)) {
              $("rows").innerHTML = "";
              setEmpty(res.status === 503 ? "The exam-events service is unavailable right now." : "Could not load exam activity.");
              $("count").textContent = "—";
              setLive("off", "Live unavailable");
              return;
            }
            cursor = Number(body.latestSequence) || 0;
            total = Number(body.total) || 0;
            hasMore = !!body.hasMore;
            scanned = body.events.length;
            if (body.events.length) oldest = Number(body.events[body.events.length - 1].sequence) || 0;
            const shown = stateWanted ? body.events.filter((e) => e.state === stateWanted) : body.events;
            $("rows").innerHTML = shown.map((ev) => rowHtml(ev, false)).join("");
            rendered = $("rows").rows.length;
            $("logScroll").scrollTop = 0;
            setEmpty(rendered || hasMore ? "" : stateWanted ? "No entries match this filter." : "No exam activity recorded yet.");
            restOfLog();
            setCount();
            startLive();
            // Nothing else is fetched here. One page is what the page size asked for;
            // the sentinel below the last row is how the reader asks for the next.
          } catch {
            $("rows").innerHTML = "";
            setEmpty("Could not reach the AgriAcademy service.");
            $("count").textContent = "—";
            setLive("off", "Live unavailable");
          } finally {
            btn.disabled = false;
          }
        }

        $("unitFilter").addEventListener("change", (e) => {
          unitFilter = e.target.value;
          // Keep the URL shareable as the filter moves.
          const next = new URL(location.href);
          if (unitFilter) next.searchParams.set("unit", unitFilter);
          else next.searchParams.delete("unit");
          history.replaceState(null, "", next);
          load();
        });
        $("stateFilter").addEventListener("change", load);
        $("limitFilter").addEventListener("change", load);
        $("refreshBtn").addEventListener("click", load);
        $("liveBtn").addEventListener("click", () => {
          // A tail that gave up leaves the pill "on" with no stream, so the obvious
          // click is a retry — not a toggle into a state it is already in.
          if (liveOn && !stream) return startLive();
          liveOn = !liveOn;
          if (liveOn) startLive();
          else {
            stopLive();
            setLive("off", "Live off");
          }
        });
        // Scrolling does two jobs at once: it decides whether the tail may write into
        // the table, and it pulls history when the bottom comes into range.
        $("logScroll").addEventListener("scroll", () => {
          const atTop = isAtTop();
          if (atTop !== following) {
            following = atTop;
            if (following) flushPending();
          }
          autoLoadMore();
        });

        $("jumpLive").addEventListener("click", () => {
          following = true;
          flushPending();
          $("logScroll").scrollTo({ top: 0, behavior: "smooth" });
        });

        // The sentinel takes the click in both of its actionable states: a failed page
        // parks the loader (rather than retrying on every scroll event) and is retried
        // here, and "Load older entries" is the manual path for a window too short to
        // scroll.
        function sentinelActivated() {
          if (olderFailed) {
            olderFailed = false;
            restOfLog();
            return void loadMore();
          }
          if (hasMore) loadMore();
        }
        $("older").addEventListener("click", sentinelActivated);
        $("older").addEventListener("keydown", (ev) => {
          if (ev.key !== "Enter" && ev.key !== " ") return;
          ev.preventDefault();
          sentinelActivated();
        });

        if ("IntersectionObserver" in window) {
          new IntersectionObserver(
            (entries) => {
              if (entries.some((e) => e.isIntersecting)) autoLoadMore();
            },
            { root: $("logScroll"), rootMargin: `${NEAR_BOTTOM}px` },
          ).observe($("older"));
        }

        // Leaving the page open in a background tab keeps one stream per visitor, so
        // it is closed on unload rather than left for the leaf to notice.
        window.addEventListener("beforeunload", stopLive);

        loadUnits().then(load);
      })();
    </script>
  </body>
</html>
